name: Build 3DS CIA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: apt-get update && apt-get install -y python3 python3-pil git cmake build-essential libpng-dev zlib1g-dev
      - name: Build bannertool and makerom
        run: |
          U="https://github.com"
          git clone "$U/3DSGuy/Project_CTR.git"
          make -C Project_CTR/makerom -j4
          cp Project_CTR/makerom/bin/makerom /usr/local/bin/
          git clone "$U/Epicpkmn11/bannertool.git"
          mkdir -p bannertool/output
          g++ -std=c++11 -DVERSION_MAJOR=1 -DVERSION_MINOR=2 -DVERSION_MICRO=0 -Ibannertool/source $(find bannertool/source -name "*.cpp" -o -name "*.c") -lpng -lz -o /usr/local/bin/bannertool
      - name: Convert Bottom.png
        run: |
          mkdir -p data
          python3 -c '
          from PIL import Image
          img = Image.open("Bottom.png").convert("RGB").resize((320, 240))
          img = img.rotate(-90, expand=True)
          with open("data/bottom.bin", "wb") as f:
              for y in range(img.height):
                  for x in range(img.width):
                      r, g, b = img.getpixel((x, y))
                      f.write(bytes([b, g, r]))
          '
      - name: Build CIA
        run: |
          make
          bannertool makebanner -i DummyBanner.png -o banner.bin
          bannertool makesmdh -s "DummyNintendoEShop" -l "DummyNintendoEShop" -p "Nintendo" -i DummyIcon.png -o icon.icn
          makerom -f cia -o DummyNintendoEShop.cia -elf DummyNintendoEShop.elf -rsf cia.rsf -banner banner.bin -icon icon.icn
      - uses: actions/upload-artifact@v4
        with:
          name: DummyNintendoEShop-CIA
          path: DummyNintendoEShop.cia
